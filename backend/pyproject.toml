[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datapilot-backend"
version = "0.1.0"
description = "Backend foundation for the DataPilot data intelligence platform"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13,<2",
    "crewai>=0.80,<1",
    "fastapi>=0.115.6,<1",
    "google-genai>=1.0,<2",
    "numpy>=2,<3",
    "openpyxl>=3.1.5,<4",
    "pandas>=2.2,<3",
    "plotly>=5.24,<6",
    "psycopg[binary]>=3.2,<4",
    "python-dotenv>=1.0.1,<2",
    "pydantic-settings>=2.6,<3",
    "python-multipart>=0.0.12,<1",
    "scipy>=1.14,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
